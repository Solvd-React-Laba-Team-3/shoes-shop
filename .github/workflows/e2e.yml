name: Run E2E Tests on PR

on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install wait-on for server readiness
        run: npm install -g wait-on

      - name: Start development server in background
        run: npm run dev &

      - name: Wait for server to be ready
        run: wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npx cypress run
